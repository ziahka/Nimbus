[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nimbustl"
dynamic = ["version"]
description = "This library is built for the Nimbus userbot and is based on Telethon."
readme = { file = "README.rst", content-type = "text/markdown" }
license = "MIT"
requires-python = ">=3.5"
authors = [
    { name = "Codrago", email = "codrago@xyecoc.com" },
]
# Vendored fork for Nimbus: renamed from herokutl 2.1.0 (MIT, Codrago),
# which is itself based on Telethon (MIT, Lonami). See LICENSE.md.
keywords = [
    "api",
    "chat",
    "client",
    "library",
    "messaging",
    "mtproto",
    "telegram",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "pyaes",
    "rsa",
    "bs4==0.0.2",
]

[project.optional-dependencies]
cryptg = [
    "cryptg",
]

[project.urls]
Source = "https://github.com/ziahka/Nimbus/tree/master/vendor/nimbustl"
Documentation = "https://docs.telethon.dev"
Reference = "https://tl.telethon.dev"

[tool.hatch.version]
path = "nimbustl/version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/nimbustl",
    "/telethon_generator",
    "/hatch_build.py",
]

[tool.hatch.build.hooks.custom]
